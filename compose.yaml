name: sre-lab-dev

services:
  app:
    image: sre-lab-app:v2.0-dev
    container_name: sre-app-dev
    network_mode: bridge
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - /etc/sre-container.env
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3); assert r.status == 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s